main{max-width:640px; margin:0 auto; padding:14px 14px 40px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
.tr{display:block; font-weight:500; font-size:12.5px; color:var(--muted); line-height:1.35;} .tr .ar{direction:rtl; unicode-bidi:isolate;}

label{display:block; font-weight:700; font-size:15px; margin:0 0 14px;}

textarea{min-height:70px;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 35%,transparent); border-color:var(--focus);}
.bad{border-color:var(--red) !important; background:var(--red-bg);}
.btn{display:block; width:100%; padding:15px; border:0; border-radius:14px; font:inherit; font-size:18px; font-weight:800; background:var(--red); color:#fff; cursor:pointer; text-align:center;}
.btn .tr{color:rgba(255,255,255,.85);}
.btn:disabled{opacity:.6;} .btn.ghost{background:#fff; color:var(--ink); border:2px solid var(--line);} .btn.ghost .tr{color:var(--muted);} .btn.navy{background:var(--navy);} .btn.green{background:var(--ok);}

.big2 svg{width:44px; height:44px;}
.hello{display:flex; align-items:center; gap:10px; justify-content:space-between;} .hello b{font-size:19px;}
.link{background:none; border:0; color:var(--focus); font:inherit; font-size:15px; font-weight:700; padding:6px; cursor:pointer;}

.tile .nm{font-weight:800; font-size:14px; line-height:1.2;} .tile .tr{font-size:11.5px;}

.tiles.small{grid-template-columns:repeat(4,1fr);} .tiles.small .pic{width:46px; height:46px;} .tiles.small .pic svg{width:42px; height:42px;} .tiles.small .nm{font-size:12.5px;}

.hidden{display:none !important;}
.center{text-align:center; padding:40px 16px; color:var(--muted);}
footer{text-align:center; font-size:12.5px; color:var(--muted); padding:0 16px 24px;}

</style>

  const svg=k=>`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||ICON.other}</svg>`;
  const pic=it=>it.img ? `<img src="${esc(it.img)}" alt="">` : svg(it.ic);
  const itTr=it=>{ const t=ITEM_T[it.ic]; return t?`<span class="tr">${esc(t[0])} · <span class="ar" dir="rtl">${esc(t[1])}</span></span>`:''; };

  const token=new URLSearchParams(location.search).get('t')||'';
  const bad=msg=>{ app.innerHTML=`<div class="card"><h2>This link is not active</h2><p class="note">${esc(msg||'Ask the HSE department for the new PPE link or QR code.')}</p></div>`; };
  if(!/^[A-Za-z0-9]{16,40}$/.test(token)){ bad('This link is incomplete. Scan the QR code again.'); return; }
  let db; try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); }catch(e){ bad('The page could not start. Check the internet and open the link again.'); return; }

  let link=null, me=null, view='who', people=[], ai=0, addOpen=false, need='', reason='', note='', sentLocal=[], recSel=new Set(), pads={};
  try{ sentLocal=JSON.parse(sessionStorage.getItem('ppeSent_'+token)||'[]'); }catch(e){}
  function load(){ return db.collection('ppeLinks').doc(token).get().then(s=>{ if(!s.exists || (s.data()||{}).active===false){ bad(); return false; } link=s.data(); return true; }).catch(e=>{ console.warn(e); bad(e&&e.code==='permission-denied'?'This link has been switched off.':'Could not open the link — check the internet and try again.'); return false; }); }
  load().then(ok=>{ if(!ok) return; let last=''; try{ last=localStorage.getItem('ppeWho_'+token)||''; }catch(e){} render(last); });

  async function sha(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16); }
  const board=()=>{ const b=((link.board||{})[me.id]||[]).slice(); const ids=new Set(b.map(x=>x.id)); for(const s of sentLocal) if(s.w===me.id && !ids.has(s.id)) b.unshift({id:s.id, k:'req', st:'sent', d:s.d, t:s.t}); return b; };
  const wById=id=>(link.workers||[]).find(x=>x.id===id);

  // division + search + name — used for "choose your name" and "add another person"

  function pickerHtml(p, div){ const dl=divList();

    const ws=(link.workers||[]).filter(w=>!exclude.has(w.id) && (!d || (w.dv||'Other')===d) && (!s || w.name.toLowerCase().includes(s))).sort((a,b)=>a.name.localeCompare(b.name));

  }
  function wirePicker(p, exclude, keep, onSel){
    const go=()=>{ fillNames(p, exclude); onSel&&onSel(); };

    $('#'+p+'q').addEventListener('input', go); $('#'+p+'s').addEventListener('change', ()=>onSel&&onSel());
    fillNames(p, exclude, keep); onSel&&onSel();
  }
  const cartOf=i=>people[i].cart;
  const totalItems=()=>people.reduce((n,p)=>n+p.cart.length,0);

  function render(lastId){
    if(view==='who'){
      let div=''; try{ div=localStorage.getItem('ppeDiv_'+token)||''; }catch(e){}
      const lw=wById(lastId); if(lw && div && (lw.dv||'Other')!==div) div=lw.dv||'Other';
      app.innerHTML=`<div class="card"><h2>${tr('pick')}</h2>${pickerHtml('w', div)}
        <label id="cidBox">${tr('cid')}<input id="cid" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off" placeholder="••••"></label>
        <div id="err" class="err hidden"></div>
        <button class="btn navy" id="go">${tr('cont')}</button></div>`;
      const syncCid=()=>{ const w=wById($('#ws').value); $('#cidBox').classList.toggle('hidden', !!w && !w.h); };
      wirePicker('w', new Set(), lastId||'', syncCid);
      $('#go').addEventListener('click', async ()=>{
        const w=wById($('#ws').value), er=$('#err');
        if(!w){ er.textContent='Choose your name.'; er.classList.remove('hidden'); $('#ws').classList.add('bad'); return; }
        if(w.h){ const d=$('#cid').value.replace(/\D/g,''); if(d.length!==4 || await sha(token+':'+d)!==w.h){ er.textContent='The Civil ID digits do not match. Try again, or ask HSE.'; er.classList.remove('hidden'); $('#cid').classList.add('bad'); return; } }
        me=w; try{ localStorage.setItem('ppeWho_'+token, w.id); localStorage.setItem('ppeDiv_'+token, w.dv||''); }catch(e){} view='home'; render(); window.scrollTo(0,0);

      const b=board(), nRec=b.filter(x=>x.st==='approved'||x.st==='confirm').length;
      app.innerHTML=`<div class="card"><div class="hello"><div>${tr('hello')}<b>${esc(me.name)}</b>${me.dv?`<span class="tr">${esc(me.dv)}</span>`:''}</div><button class="link" id="out">${tr('notme')}</button></div></div>
        <div class="big2" style="margin-bottom:14px;"><button class="btn" id="toReq">${svg('helmet')}${tr('req')}</button><button class="btn green" id="toRec">${svg('impact')}${tr('rec')}${nRec?` <span class="badge" style="background:#fff;color:var(--ok)">${nRec}</span>`:''}</button></div>

      $('#out').onclick=()=>{ me=null; tric=null; view='who'; render(); };

      const tile=(it,small)=>`<button type="button" class="tile ${inCart(it.n)?'on':''}" data-it="${esc(it.n)}"><div class="pic">${pic(it)}</div><div class="nm">${esc(it.n)}</div>${small?'':itTr(it)}</button>`;
      const chips=people.map((p,i)=>`<span class="pchip-w"><button type="button" class="pchip ${i===ai?'on':''}" data-p="${i}">${i===0?esc(T.me[0])+' · ':''}${esc(p.name)}<span class="cnt">${p.cart.length}</span></button>${i?`<button type="button" class="pchip-x" data-px="${i}" aria-label="Remove ${esc(p.name)}">✕</button>`:''}</span>`).join('');
      const selBlock=(c,pi,ci)=>{ const it=items.find(x=>x.n===c.item)||{n:c.item, ic:'other', sz:[]}; return `<div class="sel"><div class="sel-h">${pic(it)}<span>${esc(c.item)}</span><button class="link" data-rm="${pi}|${ci}">${T.remove[0]}</button></div>
            ${(it.sz||[]).length?`<div class="note" style="margin-top:8px;">${tr('size')}</div><div class="szs">${it.sz.map(s=>`<button type="button" class="${c.size===s?'on':''}" data-sz="${pi}|${ci}" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}
            <div class="note">${tr('qty')}</div><div class="qty"><button type="button" data-q="${pi}|${ci}" data-d="-1">−</button><b>${c.qty}</b><button type="button" data-q="${pi}|${ci}" data-d="1">+</button></div></div>`; };
      app.innerHTML=`<div class="card"><div style="font-weight:700; font-size:15px;">${tr('forWho')}</div><div class="pchips">${chips}<button type="button" class="pchip add" id="addP">+ ${esc(T.addP[0])}</button></div>
          ${addOpen?`<div class="addbox"><div class="note" style="margin-bottom:8px;">${tr('addHint')}</div>${pickerHtml('a', me.dv||'')}<div id="aerr" class="err hidden"></div><div style="display:flex; gap:8px;"><button type="button" class="btn navy" id="addGo">${tr('add')}</button><button type="button" class="btn ghost" id="addNo">${tr('back')}</button></div></div>`:''}</div>
        <div class="card"><h2>${tr('choose')}${people.length>1?`<span class="forname">${esc(people[ai].name)}</span>`:''}</h2><div class="tiles">${main.map(i=>tile(i)).join('')}</div>
          ${rest.length?`<div style="margin:14px 0 6px; font-weight:800;">${tr('more')}</div><div class="tiles small">${rest.map(i=>tile(i,true)).join('')}</div>`:''}</div>
        ${totalItems()?`<div class="card">${people.map((p,pi)=>p.cart.length?`${people.length>1?`<div class="pers-h">${esc(p.name)}</div>`:''}${p.cart.map((c,ci)=>selBlock(c,pi,ci)).join('')}`:'').join('')}
          <label>${tr('need')}<input type="date" id="need" value="${esc(need||plusDays(3))}" min="${today()}"></label>
          <div style="font-weight:700; font-size:15px;">${tr('why')}</div><div class="reasons">${['New','Lost','Damaged','Worn out'].map(r=>`<button type="button" class="${reason===r?'on':''}" data-r="${esc(r)}">${tr(r)}</button>`).join('')}</div>
          <label>${tr('note')}<textarea id="note" maxlength="300">${esc(note)}</textarea></label>
          <div id="err" class="err hidden"></div>
          <button class="btn" id="send">${tr('send')}${people.length>1?` <span class="tr">${people.filter(p=>p.cart.length).length} ${people.filter(p=>p.cart.length).length===1?'person':'people'} · ${totalItems()} items</span>`:''}</button></div>`:''}
        <button class="btn ghost" id="back">${tr('back')}</button>`;
      const keep=()=>{ const n=$('#need'); if(n) need=n.value; const t=$('#note'); if(t) note=t.value; };

      app.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{ keep(); const n=b.dataset.it, c=cartOf(ai), i=c.findIndex(x=>x.item===n); if(i>=0) c.splice(i,1); else { const it=items.find(x=>x.n===n)||{}; c.push({item:n, size:(it.sz||[]).length?'':'-', qty:1}); } render(); });

    }
    if(view==='rec'){
      const wait=board().filter(x=>x.st==='approved'||x.st==='confirm');
      const groups=[]; for(const x of wait){ const wid=x.w||me.id; let g=groups.find(y=>y.wid===wid); if(!g){ g={wid, name:wid===me.id?me.name:(x.f||(wById(wid)||{}).name||'—'), list:[]}; groups.push(g); } g.list.push(x); }
      groups.sort((a,b)=>(a.wid===me.id?-1:b.wid===me.id?1:a.name.localeCompare(b.name)));
      const key=x=>x.k+'~'+x.id+'~'+(x.li||0), multi=groups.length>1;
      app.innerHTML=`<div class="card"><h2>${tr('recH')}</h2>${wait.length?groups.map((g,gi)=>`<div class="rgroup">${multi?`<div class="pers-h">${esc(g.name)}${g.wid!==me.id?` <span class="tr">${tr('signOwn')}</span>`:''}</div>`:''}
          ${g.list.map(x=>`<label class="rc ${recSel.has(key(x))?'on':''}"><input type="checkbox" data-rc="${esc(key(x))}" ${recSel.has(key(x))?'checked':''}><span><b>${esc(x.t||'')}</b><span class="tr">${esc(dmy(x.d))} · ${x.st==='confirm'?esc(T.st_confirm[0]):esc(T.st_approved[0])}</span></span></label>`).join('')}
          <div style="font-weight:700; margin-top:10px;">${tr('sign')}${multi||g.wid!==me.id?` — <span class="forname" style="display:inline">${esc(g.name)}</span>`:''}</div><div class="sigbox"><canvas data-pad="${gi}" width="600" height="212"></canvas><div class="hint" data-hint="${gi}">✍</div></div>
          <div style="display:flex; gap:8px; margin:8px 0 14px;"><button type="button" class="btn ghost" data-clr="${gi}" style="padding:10px;">${tr('clear')}</button></div></div>`).join('')+`
          <div id="err" class="err hidden"></div><button class="btn green" id="conf">${tr('confirm')}</button>`:`<p class="note">${tr('nothing')}</p>`}</div>
        <button class="btn ghost" id="back">${tr('back')}</button>`;
      app.querySelectorAll('[data-rc]').forEach(c=>c.onchange=()=>{ if(c.checked) recSel.add(c.dataset.rc); else recSel.delete(c.dataset.rc); c.closest('.rc').classList.toggle('on', c.checked); });
      $('#back').onclick=()=>{ view='home'; render(); };
      pads={}; groups.forEach((g,gi)=>{ pads[gi]=makePad(app.querySelector(`[data-pad="${gi}"]`), app.querySelector(`[data-hint="${gi}"]`)); });
      app.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>pads[b.dataset.clr].clear());
      if(wait.length) $('#conf').onclick=()=>sendRec(groups, key);
      return;
    }
    if(view==='tric'){ renderTric(); return; }
    if(view==='tric2'){ renderTric2(); return; }
    if(view==='tricSent'){ app.innerHTML=`<div class="card done"><div class="tick">✓</div><h2>${tr('tbtSent')}</h2><p class="note">${tr('tbtSent2')}</p><button class="btn navy" id="home">${tr('back')}</button></div>`; $('#home').onclick=()=>{ view='home'; render(); }; return; }
    if(view==='sent' || view==='thanks'){
      app.innerHTML=`<div class="card done"><div class="tick">✓</div><h2>${tr(view==='sent'?'sent':'thanks')}</h2>${view==='sent'?`<p class="note">${tr('sent2')}</p>`:''}<button class="btn navy" id="home">${tr('back')}</button></div>`;
      $('#home').onclick=()=>{ view='home'; load().then(ok=>{ if(ok) render(); }); };
    }
  }

  /* ===== Batch 77: Toolbox Talk Risk Identification Card (TRIC) ===== */
  const TR_MUSTED=[['PLAN','Procedure / Work Instruction / Risk Assessment · Lift plan / Permit to work / Third party checklist · Barrier owners identified / Role · Verify understanding / Competency'],
    ['CHECK EQUIPMENT','Certification (COC & COS) / Calibrated · Inspected / Tested / Fit for purpose / Backup available'],
    ['PREPARE AREA','House keeping · Zone management (Red / No-Go) · SIMOPS (Above / Below / Beside) · Emergency preparedness'],
    ['CONTROL ENERGY','Isolate (Lock out, Tag out & Test) · Line of fire: manage stored energy — pressurized equipment, tension lines, rotating equipment'],
    ['COMMUNICATE','Toolbox talk (ask open questions) · Radios / Hand signals / Signage · LFI / Focus area — personal & process safety'],
    ['FINAL CHECKS','100% ready to go / Complete permit to work · Emergency response plan in place · Walk the line with P&ID'],
    ['START WORK','Comply – Intervene – Respect · Adhere to Life Saving Rules · Well barriers / DROPS / Hands off · STOP & re-assess risk when things change']];
  const TR_STEPS=['Introduction, headcount, fitness check','Discuss activity / task scope','Share roles and responsibilities','Discuss hazard and risk of the activity','Check risk control, mitigation availability','Discuss best practice','Two-way communication, confirm understanding'];
  const TR_CHANGES={pm:'People, methods, process', te:'Tools or equipment', nh:'New hazards identified', we:'Weather'};
  const TR_LSR={bsc:'Bypassing safety controls', cs:'Confined space', drv:'Driving', ei:'Energy isolation', hw:'Hot work', lof:'Line-of-fire', sml:'Safe mechanical lifting', wa:'Work authorisation', wah:'Working at height'};
  const TR_HZ={mv:'Moving vehicles or machinery', el:'Electrical equipment / installation', sl:'Uneven or slippery surfaces', hp:'High pressure / high temperature', ch:'Chemicals / radiation', gas:'Gas release / H2S / fire', dro:'Dropped objects', lh:'Lifting & handling', no:'Noise or other environmental hazards'};
  const nowHM=()=>{ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  let tric=null, tpads={};
  function tricNew(){ let pid=''; try{ pid=localStorage.getItem('ppeProj_'+token)||''; }catch(e){} const ps=link.projects||[]; if(!ps.some(p=>p.id===pid)) pid=ps.length===1?ps[0].id:'';
    tric={pid, loc:'', date:today(), time:nowHM(), job:'', permit:'', task:'', att:[], musted:[], steps:[], changes:[], lsr:[], hz:[], ctrl:{}, dra:[], debrief:'', addOpen:false, sigs:{}, lead:''}; }
  const tq=(k)=>app.querySelector(`[data-t="${k}"]`);
  function tricRead(){ if(!tric) return; for(const k of ['pid','loc','date','time','job','permit','task','debrief']){ const el=tq(k); if(el) tric[k]=el.value; }
    app.querySelectorAll('[data-tc]').forEach(el=>{ const [hz,f]=el.dataset.tc.split('|'); (tric.ctrl[hz]=tric.ctrl[hz]||{})[f]=el.value; });
    app.querySelectorAll('[data-td]').forEach(el=>{ const [i,f]=el.dataset.td.split('|'); if(tric.dra[+i]) tric.dra[+i][f]=el.value; }); }
  const respOpts=(sel)=>`<option value="">—</option>`+[{w:me.id, n:me.name}, ...tric.att].map(a=>`<option value="${esc(a.w)}" ${a.w===sel?'selected':''}>${esc(a.n)}</option>`).join('');
  const chk=(grp,k,label,on,sub)=>`<label class="tk ${on?'on':''}"><input type="checkbox" data-tk="${grp}|${k}" ${on?'checked':''}><span><b>${esc(label)}</b>${sub?`<span class="tk-s">${esc(sub)}</span>`:''}</span></label>`;
  function renderTric(){
    const t=tric, ps=link.projects||[];
    const ctrlRows=t.hz.map(hz=>{ const c=t.ctrl[hz]||{}; return `<div class="crow"><div class="crow-h">⚠ ${esc(TR_HZ[hz]||hz)}</div>
        <label>${tr('ctrl')}<input data-tc="${hz}|m" value="${esc(c.m||'')}" maxlength="200" placeholder="e.g. barricade the area, banksman"></label>
        <div class="row2"><label>${tr('resp')}<select data-tc="${hz}|r">${respOpts(c.r)}</select></label><label>${tr('done')}<select data-tc="${hz}|ok"><option value="">—</option>${['Yes','No'].map(v=>`<option ${c.ok===v?'selected':''}>${v}</option>`).join('')}</select></label></div></div>`; }).join('');
    const draRows=t.dra.map((c,i)=>`<div class="crow"><div class="crow-h">${tr('draOne')} ${i+1} <button type="button" class="link" data-tdrx="${i}" style="float:right;">${T.remove[0]}</button></div>
        <label>${tr('draHz')}<input data-td="${i}|hz" value="${esc(c.hz||'')}" maxlength="120"></label>
        <label>${tr('ctrl')}<input data-td="${i}|m" value="${esc(c.m||'')}" maxlength="200"></label>
        <div class="row2"><label>${tr('resp')}<select data-td="${i}|r">${respOpts(c.r)}</select></label><label>${tr('done')}<select data-td="${i}|ok"><option value="">—</option>${['Yes','No'].map(v=>`<option ${c.ok===v?'selected':''}>${v}</option>`).join('')}</select></label></div></div>`).join('');
    app.innerHTML=`<div class="card tric-h"><h2>${tr('tbt')}</h2><p class="note">${tr('tbtHint')}</p></div>
      <div class="card"><div class="sec">1 · ${tr('details')}</div>
        <label>${tr('proj')}<select data-t="pid"><option value="">—</option>${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===t.pid?'selected':''}>${esc(p.n)}</option>`).join('')}</select></label>
        <label>${tr('loc')}<input data-t="loc" value="${esc(t.loc)}" maxlength="80" placeholder="e.g. Well NM-12 / Camp A"></label>
        <div class="row2"><label>${tr('date')}<input type="date" data-t="date" value="${esc(t.date)}"></label><label>${tr('time')}<input type="time" data-t="time" value="${esc(t.time)}"></label></div>
        <label>${tr('job')}<input data-t="job" value="${esc(t.job)}" maxlength="120" placeholder="e.g. Scaffold erection at Well NM-12"></label>
        <div class="row2"><label>${tr('permit')}<input data-t="permit" value="${esc(t.permit)}" maxlength="40"></label><label>${tr('task')}<input data-t="task" value="${esc(t.task)}" maxlength="120"></label></div>
        <div class="note">${tr('leader')}: <b>${esc(me.name)}</b></div></div>
      <div class="card"><div class="sec">2 · ${tr('att')} (${t.att.length})</div>
        ${t.att.length?`<div class="pchips">${t.att.map((a,i)=>`<span class="pchip-w"><span class="pchip">${esc(a.n)}</span><button type="button" class="pchip-x" data-tax="${i}" aria-label="Remove ${esc(a.n)}">✕</button></span>`).join('')}</div>`:`<p class="note">${tr('attNone')}</p>`}
        ${t.addOpen?`<div class="addbox">${pickerHtml('t', me.dv||'')}<div id="terr" class="err hidden"></div><div style="display:flex; gap:8px; flex-wrap:wrap;"><button type="button" class="btn navy" id="tAdd" style="flex:1">${tr('add')}</button><button type="button" class="btn ghost" id="tAddAll" style="flex:1">${tr('addAll')}</button></div><button type="button" class="btn ghost" id="tAddNo" style="margin-top:8px;">${tr('back')}</button></div>`
          :`<button type="button" class="pchip add" id="tAddOpen" style="margin-top:8px;">+ ${esc(T.addP[0])}</button>`}</div>
      <div class="card"><div class="sec">3 · ${tr('musted')}</div><p class="note">${tr('mustedHint')}</p>${TR_MUSTED.map(([h,s],i)=>chk('m',i,`${i+1}. ${h}`,t.musted[i],s)).join('')}</div>
      <div class="card"><div class="sec">4 · ${tr('steps')}</div>${TR_STEPS.map((s,i)=>chk('s',i,s,t.steps[i])).join('')}</div>
      <div class="card"><div class="sec">5 · ${tr('lsr')}</div><p class="note">${tr('lsrHint')}</p><div class="tk-grid">${Object.entries(TR_LSR).map(([k,l])=>chk('l',k,l,t.lsr.includes(k))).join('')}</div></div>
      <div class="card"><div class="sec">6 · ${tr('hz')}</div><p class="note">${tr('hzHint')}</p><div class="tk-grid">${Object.entries(TR_HZ).map(([k,l])=>chk('h',k,l,t.hz.includes(k))).join('')}</div></div>
      ${t.hz.length?`<div class="card"><div class="sec">7 · ${tr('hcs')}</div><p class="note">${tr('hcsHint')}</p>${ctrlRows}</div>`:''}
      <div class="card"><div class="sec">${t.hz.length?8:7} · ${tr('pause')}</div><p class="note">${tr('pauseHint')}</p><div class="tk-grid">${Object.entries(TR_CHANGES).map(([k,l])=>chk('c',k,l,t.changes.includes(k))).join('')}</div>
        <div class="sec" style="margin-top:12px;">${tr('dra')}</div>${draRows}<button type="button" class="pchip add" id="tDraAdd">+ ${esc(T.draAdd[0])}</button></div>
      <div class="card"><label>${tr('debrief')}<textarea data-t="debrief" maxlength="400">${esc(t.debrief)}</textarea></label>
        <div id="err" class="err hidden"></div><button class="btn" id="tNext">${tr('toSign')}</button></div>
      <button class="btn ghost" id="back">${tr('back')}</button>`;
    app.querySelectorAll('[data-tk]').forEach(el=>el.onchange=()=>{ tricRead(); const [g,k]=el.dataset.tk.split('|'), on=el.checked;
      if(g==='m') t.musted[+k]=on; else if(g==='s') t.steps[+k]=on;
      else { const arr=g==='l'?t.lsr:g==='h'?t.hz:t.changes; const i=arr.indexOf(k); if(on && i<0) arr.push(k); if(!on && i>=0) arr.splice(i,1); if(g==='h'){ const order=Object.keys(TR_HZ); t.hz.sort((a,b)=>order.indexOf(a)-order.indexOf(b)); keepScroll(renderTric); return; } }
      el.closest('.tk').classList.toggle('on', on); });
    app.querySelectorAll('[data-tax]').forEach(b=>b.onclick=()=>{ tricRead(); const a=t.att.splice(+b.dataset.tax,1)[0]; if(a) delete t.sigs[a.w]; keepScroll(renderTric); });
    app.querySelectorAll('[data-tdrx]').forEach(b=>b.onclick=()=>{ tricRead(); t.dra.splice(+b.dataset.tdrx,1); keepScroll(renderTric); });
    $('#tDraAdd').onclick=()=>{ tricRead(); t.dra.push({hz:'', m:'', r:'', ok:''}); keepScroll(renderTric); };
    const pid=tq('pid'); pid.onchange=()=>{ try{ localStorage.setItem('ppeProj_'+token, pid.value); }catch(e){} };
    if(t.addOpen){ const ex=()=>new Set([me.id, ...t.att.map(a=>a.w)]); wirePicker('t', ex(), '');
      $('#tAdd').onclick=()=>{ const w=wById($('#ts').value); if(!w){ const e=$('#terr'); e.textContent='Choose the name.'; e.classList.remove('hidden'); return; } tricRead(); if(t.att.length<40) t.att.push({w:w.id, n:w.name}); t.addOpen=true; keepScroll(renderTric); };
      $('#tAddAll').onclick=()=>{ tricRead(); const opts=[...$('#ts').options].filter(o=>o.value); for(const o of opts){ const w=wById(o.value); if(w && t.att.length<40 && !t.att.some(a=>a.w===w.id)) t.att.push({w:w.id, n:w.name}); } t.addOpen=false; keepScroll(renderTric); };
      $('#tAddNo').onclick=()=>{ tricRead(); t.addOpen=false; keepScroll(renderTric); }; }
    else $('#tAddOpen').onclick=()=>{ tricRead(); t.addOpen=true; keepScroll(renderTric); };
    $('#back').onclick=()=>{ tricRead(); view='home'; render(); window.scrollTo(0,0); };
    $('#tNext').onclick=()=>{ tricRead(); const m=tricCheck(); if(m) return err(m); view='tric2'; render(); window.scrollTo(0,0); };
  }
  function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
  function tricCheck(){ const t=tric;
    if(!t.pid) return 'Choose the project.'; if(!t.loc.trim()) return 'Write the location.'; if(!t.date) return 'Choose the date.'; if(!t.job.trim()) return 'Write the job.';
    if(!t.att.length) return 'Add the attendees (the crew).';
    const m=TR_MUSTED.findIndex((x,i)=>!t.musted[i]); if(m>=0) return `Musta'ed step ${m+1} (${TR_MUSTED[m][0]}) is not ticked — if you are not ready, do not start the work.`;
    const s=TR_STEPS.findIndex((x,i)=>!t.steps[i]); if(s>=0) return `TBT step not ticked: ${TR_STEPS[s]}.`;
    if(!t.hz.length) return 'Tick at least one hazard.';
    for(const hz of t.hz){ const c=t.ctrl[hz]||{}; if(!String(c.m||'').trim() || !c.r || !c.ok) return `Hazards control sheet: fill the control measure, responsible and Yes/No for "${TR_HZ[hz]}".`; }
    for(const [i,c] of t.dra.entries()){ if(!String(c.hz||'').trim() || !String(c.m||'').trim() || !c.r || !c.ok) return `Dynamic risk ${i+1}: fill the risk, control measure, responsible and Yes/No — or remove it.`; }
    return ''; }
  function renderTric2(){
    const t=tric;
    app.innerHTML=`<div class="card"><h2>${tr('signAll')}</h2><p class="note">${tr('signHint')}</p>
        ${t.att.map((a,i)=>`<div class="sgn"><div class="sgn-h">${i+1}. ${esc(a.n)} ${t.sigs[a.w]?'<span class="badge b-delivered">✓</span>':''}</div><div class="sigbox small"><canvas data-sp="${esc(a.w)}" width="600" height="200"></canvas><div class="hint" data-sh="${esc(a.w)}">✍</div></div><button type="button" class="link" data-sc="${esc(a.w)}">${T.clear[0]}</button></div>`).join('')}
        <div class="sgn lead"><div class="sgn-h">${tr('leadSign')}: ${esc(me.name)}</div><div class="sigbox small"><canvas data-sp="__lead" width="600" height="200"></canvas><div class="hint" data-sh="__lead">✍</div></div><button type="button" class="link" data-sc="__lead">${T.clear[0]}</button></div>
        <div id="err" class="err hidden"></div><button class="btn green" id="tSend">${tr('tSend')}</button></div>
      <button class="btn ghost" id="back">${tr('back')}</button>`;
    tpads={};
    app.querySelectorAll('[data-sp]').forEach(cv=>{ const k=cv.dataset.sp, p=makePad(cv, app.querySelector(`[data-sh="${CSS.escape(k)}"]`)); tpads[k]=p;
      const old=k==='__lead'?t.lead:t.sigs[k]; if(old){ const im=new Image(); im.onload=()=>{ cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); p.ink=true; const h=app.querySelector(`[data-sh="${CSS.escape(k)}"]`); if(h) h.classList.add('hidden'); }; im.src=old; }
      p.onEnd=()=>{ if(k==='__lead') t.lead=p.image(300,100); else t.sigs[k]=p.image(300,100); }; });
    app.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{ const k=b.dataset.sc; tpads[k].clear(); if(k==='__lead') t.lead=''; else delete t.sigs[k]; });
    $('#back').onclick=()=>{ view='tric'; render(); window.scrollTo(0,0); };
    $('#tSend').onclick=tricSend;
  }
  async function tricSend(){
    const t=tric, miss=t.att.find(a=>!t.sigs[a.w]); if(miss) return err(miss.n+' has not signed yet.');
    if(!t.lead) return err('TBT leader: please sign at the bottom.');
    const nm=id=>id===me.id?me.name:((t.att.find(a=>a.w===id)||{}).n||'');
    const data={name:me.name, projectId:t.pid, loc:t.loc.trim().slice(0,80), date:t.date, time:t.time, job:t.job.trim().slice(0,120), permit:t.permit.trim().slice(0,40), task:t.task.trim().slice(0,120),
      musted:TR_MUSTED.map((x,i)=>!!t.musted[i]), steps:TR_STEPS.map((x,i)=>!!t.steps[i]), changes:t.changes.slice(), lsr:t.lsr.slice(), hz:t.hz.slice(),
      ctrl:t.hz.map(hz=>{ const c=t.ctrl[hz]||{}; return {hz, m:String(c.m||'').trim().slice(0,200), r:c.r, rn:nm(c.r), ok:c.ok}; }),
      dra:t.dra.map(c=>({hz:String(c.hz||'').trim().slice(0,120), m:String(c.m||'').trim().slice(0,200), r:c.r, rn:nm(c.r), ok:c.ok})),
      att:t.att.map(a=>({w:a.w, n:a.n, sig:t.sigs[a.w]})), debrief:String(t.debrief||'').trim().slice(0,400), leadSig:t.lead};
    const b=$('#tSend'); b.disabled=true;
    try{ await db.collection('tbtSubmissions').add({token, workerId:me.id, status:'new', data, submittedAt:firebase.firestore.FieldValue.serverTimestamp()});
      tric=null; view='tricSent'; render(); window.scrollTo(0,0); }
    catch(e){ console.warn(e); b.disabled=false; err(e&&e.code==='permission-denied'?'Not sent — the link may be switched off. Tell HSE.':'Not sent — check the internet and try again.'); }
  }
  function err(m){ const e=$('#err'); if(e){ e.textContent=m; e.classList.remove('hidden'); e.scrollIntoView({block:'center'}); } }
  async function sendReq(){
    if(!totalItems()) return err('Tap at least one PPE item.');
    const empty=people.find((p,i)=>i>0 && !p.cart.length); if(empty) return err('Choose the PPE for '+empty.name+' — or remove him with ✕.');
    for(const p of people){ const ns=p.cart.find(c=>!c.size); if(ns) return err('Choose the size of '+ns.item+(people.length>1?' for '+p.name:'')+'.'); }
    if(!reason) return err('Choose the reason.');
    const mk=p=>p.cart.map(c=>({item:c.item, size:c.size==='-'?'':c.size, qty:c.qty}));
    const data={name:me.name, items:mk(people[0]), neededBy:need||plusDays(3), reason, note:String(note||'').trim().slice(0,300)};
    if(people.length>1) data.others=people.slice(1).map(p=>({w:p.id, n:p.name, items:mk(p)}));
    const b=$('#send'); b.disabled=true;
    try{
      const ref=await db.collection('ppeRequests').add({token, kind:'request', workerId:me.id, status:'new', open:true, data, submittedAt:firebase.firestore.FieldValue.serverTimestamp()});
      const txt=t=>t.map(i=>i.item+(i.size?' '+i.size:'')+(i.qty>1?' ×'+i.qty:'')).join(', ');
      sentLocal.push({id:ref.id, w:me.id, d:today(), t:people.length>1?people.map(p=>p.name+': '+txt(mk(p))).filter((x,i)=>people[i].cart.length).join(' · '):txt(data.items)}); try{ sessionStorage.setItem('ppeSent_'+token, JSON.stringify(sentLocal.slice(-20))); }catch(e){}
      people=[]; reason=''; note=''; need=''; view='sent'; render(); window.scrollTo(0,0);
    }catch(e){ console.warn(e); b.disabled=false; err(e&&e.code==='permission-denied'?'Not sent — the link may be switched off. Tell HSE.':'Not sent — check the internet and try again.'); }
  }
  async function sendRec(groups, key){
    if(!recSel.size) return err('Tick at least one item you received.');
    const todo=groups.map((g,gi)=>({g, gi, sel:g.list.filter(x=>recSel.has(key(x)))})).filter(x=>x.sel.length);
    const unsigned=todo.find(x=>!pads[x.gi].ink); if(unsigned) return err(unsigned.g.wid===me.id?'Please sign with your finger.':unsigned.g.name+' must sign with his finger.');
    const b=$('#conf'); b.disabled=true;
    try{
      for(const t of todo){
        const refs=t.sel.map(x=>x.k==='req'?{t:'req', id:x.id, li:x.li||0}:{t:'iss', id:x.id});
        const data={name:t.g.name, refs, sig:pads[t.gi].image(), date:today()}; if(t.g.wid!==me.id) data.by=me.id;
        await db.collection('ppeRequests').add({token, kind:'receipt', workerId:t.g.wid, status:'new', open:true, data, submittedAt:firebase.firestore.FieldValue.serverTimestamp()});
        for(const x of t.sel) recSel.delete(key(x));
        if(link.board && link.board[me.id]) link.board[me.id]=link.board[me.id].map(x=>t.sel.includes(x)?{...x, st:'delivered'}:x);
      }
      view='thanks'; render(); window.scrollTo(0,0);
    }catch(e){ console.warn(e); b.disabled=false; err('Not saved — check the internet and try again.'); }
  }
  function makePad(cv, hint){
    const g=cv.getContext('2d'), p={ink:false};
    const clear=()=>{ g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); p.ink=false; if(hint) hint.classList.remove('hidden'); };
    p.clear=clear; clear(); let on=false, last=null;
    const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height}; };
    cv.addEventListener('pointerdown', e=>{ e.preventDefault(); on=true; const er=$('#err'); if(er) er.classList.add('hidden'); last=pos(e); try{ cv.setPointerCapture(e.pointerId); }catch(x){} });
    cv.addEventListener('pointermove', e=>{ if(!on) return; e.preventDefault(); const q=pos(e); g.strokeStyle='#0b1a33'; g.lineWidth=3.2; g.lineCap='round'; g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(q.x,q.y); g.stroke(); last=q; if(!p.ink){ p.ink=true; if(hint) hint.classList.add('hidden'); } });
    const end=()=>{ if(on && p.ink && p.onEnd) p.onEnd(); on=false; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
    p.image=(W,H)=>{ W=W||480; H=H||170; const o=document.createElement('canvas'); o.width=W; o.height=H; const c=o.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,W,H); c.drawImage(cv,0,0,W,H); return o.toDataURL('image/png'); };
    return p;
  }
})();
