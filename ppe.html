<style>
:root{--navy:#0b2140; --navy2:#13325c; --red:#b3121a; --red-bg:#fdecec; --ink:#16202e; --muted:#5d6878; --line:#cfd6e0; --bg:#f3f5f8; --card:#fff; --ok:#1e7a4c; --ok-bg:#e3f4ea; --warn:#9a6a00; --warn-bg:#fff6de; --focus:#1f6fd1; --blue-bg:#eaf2fd;}
*{box-sizing:border-box;}
html,body{margin:0; background:var(--bg); color:var(--ink); font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Arabic",Arial,sans-serif; -webkit-text-size-adjust:100%;}
header{background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; position:sticky; top:0; z-index:5; box-shadow:0 2px 8px rgba(0,0,0,.2);}

.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
.tr{display:block; font-weight:500; font-size:12.5px; color:var(--muted); line-height:1.35;} .tr .ar{direction:rtl; unicode-bidi:isolate;}
h2{margin:0 0 10px; font-size:19px;}
label{display:block; font-weight:700; font-size:15px; margin:0 0 14px;}
input,select,textarea{display:block; width:100%; margin-top:6px; padding:12px; font:inherit; font-size:17px; color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:12px; min-height:50px;}
textarea{min-height:70px;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 35%,transparent); border-color:var(--focus);}
.bad{border-color:var(--red) !important; background:var(--red-bg);}
.btn{display:block; width:100%; padding:15px; border:0; border-radius:14px; font:inherit; font-size:18px; font-weight:800; background:var(--red); color:#fff; cursor:pointer; text-align:center;}
.btn .tr{color:rgba(255,255,255,.85);}
.btn:disabled{opacity:.6;} .btn.ghost{background:#fff; color:var(--ink); border:2px solid var(--line);} .btn.ghost .tr{color:var(--muted);} .btn.navy{background:var(--navy);} .btn.green{background:var(--ok);}
.big2{display:grid; grid-template-columns:1fr 1fr; gap:12px;} .big2 .btn{min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;}
.big2 svg{width:44px; height:44px;}
.hello{display:flex; align-items:center; gap:10px; justify-content:space-between;} .hello b{font-size:19px;}
.link{background:none; border:0; color:var(--focus); font:inherit; font-size:15px; font-weight:700; padding:6px; cursor:pointer;}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.tile{position:relative; border:2px solid var(--line); border-radius:14px; background:#fff; padding:10px 6px 8px; text-align:center; cursor:pointer; font:inherit; color:var(--ink);}
.tile .pic{width:64px; height:64px; margin:0 auto 4px; display:grid; place-items:center; color:var(--navy);} .tile .pic svg{width:58px; height:58px;} .tile .pic img{width:64px; height:64px; object-fit:cover; border-radius:10px;}
.tile .nm{font-weight:800; font-size:14px; line-height:1.2;} .tile .tr{font-size:11.5px;}
.tile.on{border-color:var(--ok); background:var(--ok-bg); box-shadow:0 0 0 2px var(--ok);} .tile.on::after{content:"✓"; position:absolute; top:6px; right:8px; width:24px; height:24px; border-radius:50%; background:var(--ok); color:#fff; font-weight:900; display:grid; place-items:center; font-size:14px;}
.tiles.small{grid-template-columns:repeat(4,1fr);} .tiles.small .pic{width:46px; height:46px;} .tiles.small .pic svg{width:42px; height:42px;} .tiles.small .nm{font-size:12.5px;}
.sel{border:2px solid var(--ok); background:#fbfffc; border-radius:14px; padding:12px; margin-bottom:10px;}
.sel-h{display:flex; align-items:center; gap:10px; font-weight:800;} .sel-h svg{width:34px; height:34px; color:var(--navy);} .sel-h img{width:38px; height:38px; border-radius:8px; object-fit:cover;}

.qty{display:flex; align-items:center; gap:8px;} .qty button{width:46px; height:46px; border-radius:12px; border:2px solid var(--line); background:#fff; font-size:24px; font-weight:800;} .qty b{min-width:34px; text-align:center; font-size:20px;}

.note{font-size:14px; color:var(--muted);}

.hidden{display:none !important;}
.center{text-align:center; padding:40px 16px; color:var(--muted);}
footer{text-align:center; font-size:12.5px; color:var(--muted); padding:0 16px 24px;}
@media (max-width:380px){ .tiles{grid-template-columns:repeat(2,1fr);} .tiles.small{grid-template-columns:repeat(3,1fr);} }
</style>

  function alertBox(m){ const e=$('#err'); if(e) return err(m); app.insertAdjacentHTML('afterbegin', `<div class="err">${esc(m)}</div>`); }
  // TBT PDF body — the same code is in the tracker (index.html) and on the crew's phones (ppe.html)
  function tbtPdfBody(doc, x, o){
    const d=x.data||{}, s=x.sigs||{}, M=30, W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), CW=W-2*M, FS=8.6, LH=10;
    const INK=[20,22,28], LBL=[246,247,249], RED=[179,18,26], SUB=[90,96,106];
    let y=o.top||32; const ensure=h=>{ if(y+h>H-28){ doc.addPage(); y=o.top||32; } };
    const dmy2=v=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v||''); return m?`${m[3]}-${m[2]}-${m[1]}`:(v||''); };
    const drawTick=(cx,cy,on)=>{ doc.setDrawColor(110,116,126); doc.setLineWidth(0.6); doc.rect(cx-5,cy-5,10,10);
      if(on){ doc.setDrawColor(...INK); doc.setLineWidth(1.6); doc.line(cx-3.2,cy+0.2,cx-0.8,cy+2.8); doc.line(cx-0.8,cy+2.8,cx+3.8,cy-3.2); } doc.setLineWidth(0.5); };
    const row=(cells, minH)=>{ const pc=cells.map(c=>{ doc.setFont('helvetica', c.bold?'bold':'normal'); doc.setFontSize(c.size||FS); return {...c, l:(c.img||c.check!==undefined)?[]:doc.splitTextToSize(String(c.t===undefined||c.t===null||c.t===''?(c.blank?'':'—'):c.t), Math.max(10, c.w-8))}; });
      const h=Math.max(minH||15, ...pc.map(c=>c.l.length*LH+5+(c.sub?LH:0))); ensure(h); let xx=M;
      for(const c of pc){ if(c.fill){ doc.setFillColor(...c.fill); doc.rect(xx,y,c.w,h,'F'); } doc.setDrawColor(150,156,166); doc.setLineWidth(0.5); doc.rect(xx,y,c.w,h);
        if(c.img){ try{ let iw=c.w-10, ih=h-6; try{ const pr=doc.getImageProperties(c.img); const k=Math.min(iw/pr.width, ih/pr.height); iw=pr.width*k; ih=pr.height*k; }catch(e){} doc.addImage(c.img, 'PNG', xx+(c.w-iw)/2, y+(h-ih)/2, iw, ih); }catch(e){} }
        if(c.check!==undefined) drawTick(xx+c.w/2, y+h/2, !!c.check);
        doc.setFont('helvetica', c.bold?'bold':'normal'); doc.setFontSize(c.size||FS); doc.setTextColor(...(c.color||INK)); c.l.forEach((ln,i)=>doc.text(ln, xx+5, y+10.5+i*LH));
        if(c.sub){ doc.setFont('helvetica','normal'); doc.setFontSize(7.4); doc.setTextColor(...SUB); doc.text(String(c.sub), xx+5, y+10.5+c.l.length*LH); }
        xx+=c.w; }
      y+=h; doc.setTextColor(...INK); };
    const head=t=>{ ensure(34); y+=7; row([{t, w:CW, bold:true, fill:RED, color:[255,255,255], size:8.8}], 16); };
    const K=104, hw=(CW-2*K)/2, who=o.who, ds=o.ds||(()=>'');
    // title band
    doc.setFillColor(...RED); doc.rect(M,y,CW,3,'F'); y+=3;
    row([{t:'TOOLBOX TALK RECORD (TBT)', w:CW-170, bold:true, size:11.5},{t:`${dmy2(d.date)}  ·  ${d.shift||'—'} shift`, w:170, bold:true, color:RED}], 22);
    row([{t:'PROJECT', w:K, bold:true, fill:LBL},{t:o.project, w:hw},{t:'DATE / TIME', w:K, bold:true, fill:LBL},{t:`${dmy2(d.date)} ${d.time||''}`, w:hw}]);
    row([{t:'LOCATION / WELL NO.', w:K, bold:true, fill:LBL},{t:d.loc, w:hw},{t:'JOURNEY PLAN NO.', w:K, bold:true, fill:LBL},{t:d.jp||'N/A', w:hw}]);
    row([{t:'JOB / WORK', w:K, bold:true, fill:LBL},{t:d.job, w:hw},{t:'SHIFT', w:K, bold:true, fill:LBL},{t:d.shift?d.shift+' job':'—', w:hw}]);
    row([{t:'REQUESTED BY', w:K, bold:true, fill:LBL},{t:who(x.workerId), sub:ds(x.workerId), w:hw},{t:'CLIENT', w:K, bold:true, fill:LBL},{t:d.client||'—', w:hw}]);
    row([{t:'TOPIC', w:K, bold:true, fill:LBL},{t:x.topic, w:CW-K, bold:true}], 18);
    head("MUSTA'ED — ARE YOU READY?");
    o.musted.forEach(([t,sx],i)=>row([{t:`${i+1}. ${t}`, w:112, bold:true, fill:LBL},{t:sx.replace(/ · /g,'; '), w:CW-150},{check:(x.musted||[])[i], w:38}]));
    head('LIFE SAVING RULES DISCUSSED');
    const lsr=Object.entries(o.lsr); for(let i=0;i<lsr.length;i+=3) row([0,1,2].flatMap(j=>lsr[i+j]?[{t:lsr[i+j][1], w:CW/3-30},{check:(x.lsr||[]).includes(lsr[i+j][0]), w:30}]:[{t:'', w:CW/3, blank:true}]));
    const dra=x.dra||[];
    if(dra.length){ head('DYNAMIC RISK ASSESSMENT');
      row([{t:'Risk / hazard', w:150, bold:true, fill:LBL},{t:'Control measure', w:CW-150-130, bold:true, fill:LBL},{t:'Responsible', w:130, bold:true, fill:LBL}]);
      dra.forEach(r=>row([{t:r.hz, w:150},{t:r.m, w:CW-280},{t:r.r?who(r.r):(r.rn||'—'), w:130}])); }
    const att=d.att||[]; head(`ATTENDEES (${att.length}) — signed on the project link`);
    row([{t:'#', w:22, bold:true, fill:LBL},{t:'Name', w:CW/2-22-120+40, bold:true, fill:LBL},{t:'Designation', w:CW/2-40, bold:true, fill:LBL},{t:'Signature', w:120, bold:true, fill:LBL}]);
    att.forEach((p,i)=>row([{t:String(i+1), w:22},{t:who(p.w), w:CW/2-102},{t:ds(p.w)||p.ds||'—', w:CW/2-40},{img:s[p.w], t:s[p.w]?'':'not signed', w:120, color:SUB}], 30));
    const jobs=[{time:d.time, shift:d.shift, loc:d.loc, jp:d.jp, job:d.job, first:true}, ...(x.jobs||[])];
    head(`JOBS CARRIED OUT UNDER THIS TBT (${jobs.length})`);
    row([{t:'#', w:22, bold:true, fill:LBL},{t:'Time / shift', w:70, bold:true, fill:LBL},{t:'Location / well', w:100, bold:true, fill:LBL},{t:'Journey plan', w:70, bold:true, fill:LBL},{t:'Job', w:70, bold:true, fill:LBL},{t:'Pause & check — changes', w:CW-22-70-100-70-70-90, bold:true, fill:LBL},{t:'Confirmed by', w:90, bold:true, fill:LBL}]);
    jobs.forEach((j,i)=>row([{t:String(i+1), w:22},{t:`${j.time||''} ${j.shift?'('+j.shift+')':''}`, w:70},{t:j.loc, w:100},{t:j.jp||'N/A', w:70},{t:j.job, w:70},{t:j.first?'Main TBT':(j.chg&&j.chg.length?j.chg.join(', '):'No changes'), w:CW-22-70-100-70-70-90},
      j.first?{t:'All attendees', w:90, color:SUB}:{img:j.sig, t:j.sig?'':who(j.by), w:90}], j.first?15:26));
    y+=6; row([{t:`Reviewed by HSE: ${x.reviewedBy||'—'}${x.reviewedAt?'  ·  '+dmy2(String(x.reviewedAt).slice(0,10)):''}${x.status==='done'?'  ·  Complete — all attendees signed':''}`, w:CW, size:7.6, color:SUB}]);
    row([{t:'Remember the 3 golden rules: 1) Comply  2) Intervene  3) Respect. STOP the work and re-assess if anything changes.', w:CW, size:7.6, bold:true, color:RED}]);
  }
  function err(m){ const e=$('#err'); if(e){ e.textContent=m; e.classList.remove('hidden'); e.scrollIntoView({block:'center'}); } }
  async function sendReq(){
    if(!totalItems()) return err('Tap at least one PPE item.');
    const empty=people.find((p,i)=>i>0 && !p.cart.length); if(empty) return err('Choose the PPE for '+empty.name+' — or remove him with ✕.');
    for(const p of people){ const ns=p.cart.find(c=>!c.size); if(ns) return err('Choose the size of '+ns.item+(people.length>1?' for '+p.name:'')+'.'); }
    if(!reason) return err('Choose the reason.');
    const mk=p=>p.cart.map(c=>({item:c.item, size:c.size==='-'?'':c.size, qty:c.qty}));
    const data={name:me.name, items:mk(people[0]), neededBy:need||plusDays(3), reason, note:String(note||'').trim().slice(0,300), ...(link.projectId?{projectId:link.projectId}:{})};
    if(people.length>1) data.others=people.slice(1).map(p=>({w:p.id, n:p.name, items:mk(p)}));
    const b=$('#send'); b.disabled=true;
    try{
      const ref=await db.collection('ppeRequests').add({token, kind:'request', workerId:me.id, status:'new', open:true, data, submittedAt:firebase.firestore.FieldValue.serverTimestamp()});
      const txt=t=>t.map(i=>i.item+(i.size?' '+i.size:'')+(i.qty>1?' ×'+i.qty:'')).join(', ');
      sentLocal.push({id:ref.id, w:me.id, d:today(), t:people.length>1?people.map(p=>p.name+': '+txt(mk(p))).filter((x,i)=>people[i].cart.length).join(' · '):txt(data.items)}); try{ sessionStorage.setItem('ppeSent_'+token, JSON.stringify(sentLocal.slice(-20))); }catch(e){}
      people=[]; reason=''; note=''; need=''; view='sent'; render(); window.scrollTo(0,0);
    }catch(e){ console.warn(e); b.disabled=false; err(e&&e.code==='permission-denied'?'Not sent — the link may be switched off. Tell HSE.':'Not sent — check the internet and try again.'); }
  }
  async function sendRec(groups, key){
    if(!recSel.size) return err('Tick at least one item you received.');
    const todo=groups.map((g,gi)=>({g, gi, sel:g.list.filter(x=>recSel.has(key(x)))})).filter(x=>x.sel.length);
    const unsigned=todo.find(x=>!pads[x.gi].ink); if(unsigned) return err(unsigned.g.wid===me.id?'Please sign with your finger.':unsigned.g.name+' must sign with his finger.');
    const b=$('#conf'); b.disabled=true;
    try{
      for(const t of todo){
        const refs=t.sel.map(x=>x.k==='req'?{t:'req', id:x.id, li:x.li||0}:{t:'iss', id:x.id});
        const data={name:t.g.name, refs, sig:pads[t.gi].image(), date:today()}; if(t.g.wid!==me.id) data.by=me.id;
        await db.collection('ppeRequests').add({token, kind:'receipt', workerId:t.g.wid, status:'new', open:true, data, submittedAt:firebase.firestore.FieldValue.serverTimestamp()});
        for(const x of t.sel) recSel.delete(key(x));
        if(link.board && link.board[me.id]) link.board[me.id]=link.board[me.id].map(x=>t.sel.includes(x)?{...x, st:'delivered'}:x);
      }
      view='thanks'; render(); window.scrollTo(0,0);
    }catch(e){ console.warn(e); b.disabled=false; err('Not saved — check the internet and try again.'); }
  }
  function makePad(cv, hint){
    const g=cv.getContext('2d'), p={ink:false};
    const clear=()=>{ g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); p.ink=false; if(hint) hint.classList.remove('hidden'); };
    p.clear=clear; clear(); let on=false, last=null;
    const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height}; };
    cv.addEventListener('pointerdown', e=>{ e.preventDefault(); on=true; const er=$('#err'); if(er) er.classList.add('hidden'); last=pos(e); try{ cv.setPointerCapture(e.pointerId); }catch(x){} });
    cv.addEventListener('pointermove', e=>{ if(!on) return; e.preventDefault(); const q=pos(e); g.strokeStyle='#0b1a33'; g.lineWidth=3.2; g.lineCap='round'; g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(q.x,q.y); g.stroke(); last=q; if(!p.ink){ p.ink=true; if(hint) hint.classList.add('hidden'); } });
    const end=()=>{ if(on && p.ink && p.onEnd) p.onEnd(); on=false; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
    p.image=(W,H)=>{ W=W||480; H=H||170; const o=document.createElement('canvas'); o.width=W; o.height=H; const c=o.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,W,H); c.drawImage(cv,0,0,W,H); return o.toDataURL('image/png'); };
    return p;
  }
